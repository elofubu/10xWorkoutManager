<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Workouts" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>10x-workout-manager</title>
    <base href="/" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="WorkoutManager.Web.styles.css" rel="stylesheet" />
</head>

  <body>
    <div id="app">
    </div>

    <div id="blazor-error-ui">
      An unhandled error has occurred.
      <a href="." class="reload">Reload</a>
      <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script>
      // Rest timer alert (Components/RestTimer.razor): a double beep plus vibration where supported (not iOS).
      window.restTimer = {
        ctx: null,
        unlock: function () {
          try {
            this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
            this.ctx.resume();
          } catch (e) { /* no audio */ }
        },
        alert: function () {
          if (navigator.vibrate) navigator.vibrate([300, 150, 300]);
          var ctx = this.ctx;
          if (!ctx) return;
          [0, 0.4].forEach(function (t) {
            var start = ctx.currentTime + t, osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.frequency.value = 880;
            gain.gain.setValueAtTime(0.3, start);
            gain.gain.exponentialRampToValueAtTime(0.001, start + 0.3);
            osc.connect(gain).connect(ctx.destination);
            osc.start(start);
            osc.stop(start + 0.3);
          });
        }
      };
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js').catch(function () { /* install prompt is optional */ });
      }
    </script>
  </body>
</html>

name: Deploy to Azure

on:
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    environment: TST
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: WorkoutManager.Web Secrets Variables Substitution
        # WASM reads config from wwwroot/appsettings.json, not the project-root file, and
        # only ever gets the anon key — never Supabase.Secret. That stays server-side, used
        # only by WorkoutManager.Api's own substitution step (added in Phase 5).
        uses: microsoft/variable-substitution@v1
        with:
          files: "WorkoutManager.Web/wwwroot/appsettings.json"
        env:
          Supabase.Url: ${{ secrets.SUPABASESETTINGS_URL }}
          Supabase.AnonKey: ${{ secrets.SUPABASESETTINGS_ANONKEY }}
          # TODO (Phase 5): set once WorkoutManager.Api is deployed
          ApiUrl: ${{ secrets.API_URL }}

      - name: Tests Secrets Variables Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: "**/appsettings.Testing.json"
        env:
          SupabaseSettings.Secret: ${{ secrets.SUPABASESETTINGS_SECRET }}
          SupabaseSettings.TestUserId: ${{ secrets.SUPABASESETTINGS_TESTUSERID }}
          SupabaseSettings.Url: ${{ secrets.SUPABASESETTINGS_URL }}
          JwtBearerSettings.Key: ${{ secrets.JWTBEARERSETTINGS_KEY }}
          ConnectionStrings.DefaultConnection: ${{ secrets.CONNECTIONSTRINGS_DEFAULTCONNECTION }}

      - name: Run Unit and Integration Tests
        run: |
          dotnet test WorkoutManager.BusinessLogic.Tests --no-build --configuration Release
          dotnet test WorkoutManager.Data.Tests --no-build --configuration Release

      - name: Publish Web artifact
        run: dotnet publish ./WorkoutManager.Web -c Release -o ./web-app

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: ./web-app

      - name: Publish Api artifact
        run: dotnet publish ./WorkoutManager.Api -c Release -o ./api-app

      - name: Upload Api artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ./api-app

  deploy_web:
    runs-on: ubuntu-latest
    needs: build_and_test
    environment:
      name: PRD
      url: ${{ steps.deploy-to-swa.outputs.static_web_app_url }}
    steps:
      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: web-app

      - name: WorkoutManager.Web PRD Secrets Variables Substitution
        # Scoped to wwwroot/appsettings.json specifically (was "**/appsettings.json", which
        # would have also matched appsettings.Testing.json etc. under the published output).
        uses: microsoft/variable-substitution@v1
        with:
          files: "wwwroot/appsettings.json"
        env:
          Supabase.Url: ${{ secrets.SUPABASESETTINGS_URL }}
          Supabase.AnonKey: ${{ secrets.SUPABASESETTINGS_ANONKEY }}
          ApiUrl: ${{ secrets.API_URL }}

      # Static Web Apps deploys via its own deployment token, not the AZURE_CREDENTIALS
      # service principal used below for the Api's App Service — no azure/login needed here.
      - name: Deploy to Azure Static Web Apps
        id: deploy-to-swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "wwwroot"
          skip_app_build: true

  deploy_api:
    runs-on: ubuntu-latest
    needs: build_and_test
    environment:
      name: PRD
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download Api artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: WorkoutManager.Api PRD Secrets Variables Substitution
        uses: microsoft/variable-substitution@v1
        with:
          files: "appsettings.json"
        env:
          SupabaseSettings.Url: ${{ secrets.SUPABASESETTINGS_URL }}
          SupabaseSettings.Secret: ${{ secrets.SUPABASESETTINGS_SECRET }}
          JwtBearerSettings.IssuerSigningKey: ${{ secrets.JWTBEARERSETTINGS_KEY }}

      # TODO: app-name is a placeholder — set to whatever you name the App Service you create
      # for the Api (see Phase 5 notes). Needs its own resource; the Web app no longer runs
      # on App Service at all now that it's moved to Static Web Apps above.
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: "workout-manager-api"
          package: .

      - name: Logout from Azure
        run: |
          az logout
